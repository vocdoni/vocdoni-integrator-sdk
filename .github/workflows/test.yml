name: Test

on:
  pull_request:
  # Reusable: release.yml calls this workflow so a release can't start on a
  # failing test suite. See .github/workflows/release.yml.
  workflow_call:

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc over src, tests included: vitest strips types, so a test's
      # @ts-expect-error guard only fails here.
      - name: Type-check
        run: pnpm lint && pnpm exec tsc --noEmit -p integration

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pull-request
          path: coverage

  # Coverage of the PR's base branch, used as the comparison baseline so the
  # PR comment shows increase/decrease deltas. Skipped when called from
  # release.yml (push event), where there is nothing to compare against.
  baseline:
    name: Coverage baseline
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        # A broken base branch shouldn't fail the PR: coverage is still
        # written on failure (reportOnFailure in vitest.config.ts).
        continue-on-error: true
        run: pnpm test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: coverage

  report:
    name: Coverage report
    if: ${{ github.event_name == 'pull_request' }}
    needs: [test, baseline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required to post the coverage comment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PR coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-pull-request
          path: coverage

      - name: Download baseline coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-baseline
          path: coverage-baseline

      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-compare-path: coverage-baseline/coverage-summary.json

name: Integration

# Runs integration/full-flow.itest.ts against a disposable mongo + vocone +
# saas-backend stack (integration/docker-compose.ci.yml), built from published
# `:main` images. Not called from release.yml: this job depends on
# externally-published images and a live chain, so a red run often means
# "upstream moved" rather than "this repo is broken" — that must not block npm
# publishing (release gating stays on .github/workflows/test.yml only).
# A maintainer comment `/integration vocdoni-node=<ref> saas-backend=<ref>` on a PR
# runs it once against images built from source at those refs; refs that are
# branches, tags or #PRs also stick to the PR until `/integration reset`
# (see integration/README.md). The pull_request event re-resolves sticky refs on
# every push. workflow_dispatch takes the same refs as inputs, plus the SDK ref.
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      vocdoni_node_ref:
        description: 'vocdoni-node commit SHA, branch, tag, #PR or bare PR number to build from source (empty = :main image)'
        type: string
        required: false
        default: ''
      saas_backend_ref:
        description: 'saas-backend commit SHA, branch, tag, #PR or bare PR number to build from source (empty = :main image)'
        type: string
        required: false
        default: ''
      integrator_sdk_ref:
        description: 'integrator-sdk commit SHA, branch or #PR to test (empty = the branch picked in "Use workflow from")'
        type: string
        required: false
        default: ''
  issue_comment:
    types: [created]
  pull_request:

jobs:
  resolve:
    name: Resolve refs
    runs-on: ubuntu-latest
    # Runs for a dispatch, a pull_request, or a `/integration` comment on a pull
    # request. push and schedule never reach it, and an unrelated comment is
    # skipped here, which skips the integration job too.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/integration'))
    permissions:
      contents: read
      pull-requests: write
      issues: write # the 👀 reaction on the comment
    outputs:
      authorized: ${{ steps.refs.outputs.authorized }}
      parsed: ${{ steps.refs.outputs.parsed }}
      reset: ${{ steps.refs.outputs.reset }}
      sticky: ${{ steps.refs.outputs.sticky }}
      checkout_ref: ${{ steps.refs.outputs.checkout_ref }}
      head_sha: ${{ steps.refs.outputs.head_sha }}
      vocdoni_node_ref: ${{ steps.refs.outputs.vocdoni_node_ref }}
      saas_backend_ref: ${{ steps.refs.outputs.saas_backend_ref }}
    steps:
      # Default ref: on issue_comment that is main, so the parser runs trusted code.
      # On pull_request it is the PR's merge ref, so the parser comes from that merge commit.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCH_NODE: ${{ inputs.vocdoni_node_ref }}
          DISPATCH_SAAS: ${{ inputs.saas_backend_ref }}
          DISPATCH_SDK: ${{ inputs.integrator_sdk_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            # Sticky pins from the PR's own comments. Refs are re-resolved here
            # on every push; checkout_ref stays empty (the default merge ref).
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" | jq -s 'add // []' | scripts/integration-sticky.sh >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = issue_comment ]; then
            # A failed lookup fails this step (reported as an error). Only a
            # successful answer below admin/maintain/write is a rejection.
            permission="$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission)"
            case "$permission" in
              admin | maintain | write) ;;
              *)
                echo "::error::$ACTOR has '$permission' on $REPO; /integration needs write access" >&2
                exit 1
                ;;
            esac
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null || true
            pins_out="$RUNNER_TEMP/pins.out"
            printf '%s\n' "$COMMENT_BODY" | scripts/integration-pins.sh > "$pins_out"
            cat "$pins_out" >> "$GITHUB_OUTPUT"
            echo "parsed=true" >> "$GITHUB_OUTPUT"
            # `/integration reset` builds nothing: the report only says the sticky state is cleared.
            if grep -qx 'reset=true' "$pins_out"; then
              exit 0
            fi
            # Tests the same merge commit a pull_request run would, frozen when
            # this run starts; a push after that is not picked up.
            pr_json="$RUNNER_TEMP/pr.json"
            for _ in 1 2 3 4 5; do
              gh api "repos/$REPO/pulls/$PR" > "$pr_json"
              if [ "$(jq -r '.mergeable' "$pr_json")" != null ]; then
                break
              fi
              sleep 3
            done
            merge_sha="$(jq -r '.merge_commit_sha // empty' "$pr_json")"
            mergeable="$(jq -r '.mergeable' "$pr_json")"
            if [ -z "$merge_sha" ] || [ "$mergeable" != true ]; then
              echo "::error::PR #$PR does not merge cleanly into its base (mergeable=$mergeable)" >&2
              exit 1
            fi
            head_sha="$(jq -r '.head.sha' "$pr_json")"
            {
              echo "checkout_ref=$merge_sha"
              echo "head_sha=$head_sha"
            } >> "$GITHUB_OUTPUT"
          else
            # Whitespace would let one input smuggle a second key into the line below.
            for value in "$DISPATCH_NODE" "$DISPATCH_SAAS" "$DISPATCH_SDK"; do
              if [[ "$value" =~ [[:space:]] ]]; then
                echo "::error::ref inputs must not contain whitespace" >&2
                exit 1
              fi
            done
            line="/integration"
            if [ -n "$DISPATCH_NODE" ]; then
              line="$line vocdoni-node=$DISPATCH_NODE"
            fi
            if [ -n "$DISPATCH_SAAS" ]; then
              line="$line saas-backend=$DISPATCH_SAAS"
            fi
            printf '%s\n' "$line" | scripts/integration-pins.sh >> "$GITHUB_OUTPUT"
            echo "parsed=true" >> "$GITHUB_OUTPUT"
            # The SDK ref to check out: #N is a PR head, anything else a commit, branch or tag.
            if [ -n "$DISPATCH_SDK" ]; then
              if ! [[ "$DISPATCH_SDK" =~ ^#[0-9]{1,9}$ || "$DISPATCH_SDK" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] || [[ "$DISPATCH_SDK" == *..* ]]; then
                echo "::error::integrator_sdk_ref '$DISPATCH_SDK' is not a commit SHA, branch, tag or #PR" >&2
                exit 1
              fi
              if [[ "$DISPATCH_SDK" == \#* ]]; then
                sdk_sha="$(gh api "repos/$REPO/pulls/${DISPATCH_SDK:1}" --jq .head.sha)"
              else
                sdk_sha="$(gh api -H 'Accept: application/vnd.github.sha' "repos/$REPO/commits/$DISPATCH_SDK")"
              fi
              if ! [[ "$sdk_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::could not resolve integrator_sdk_ref '$DISPATCH_SDK' in $REPO" >&2
                exit 1
              fi
              echo "checkout_ref=$sdk_sha" >> "$GITHUB_OUTPUT"
            fi
          fi

  integration:
    name: Integration suite
    needs: resolve
    # resolve only runs for dispatches, pull requests and /integration comments.
    # An unrelated comment skips it, and that skip must skip this job too. A
    # cleared `/integration reset` builds nothing, so it skips this job as well.
    if: ${{ !cancelled() && needs.resolve.outputs.reset != 'true' && (needs.resolve.result == 'success' || (needs.resolve.result == 'skipped' && github.event_name != 'issue_comment')) }}
    runs-on: ubuntu-latest
    # Runs on every PR, unconditionally. Pinned saas-backend builds need the
    # SAAS_BACKEND_DEPLOY_KEY secret, which fork pull_request runs don't get: a fork
    # PR with a sticky saas-backend pin fails until a maintainer's /integration comment
    # runs it. Unpinned runs use no secrets.
    #
    # Measured cost on a real runner: ~3.5 min end to end (12s image pulls, 29s
    # to a booted-and-bootstrapped stack, 144s suite) — close enough to the
    # existing Test job that gating it behind a label was not worth the risk of
    # a regression merging green.
    #
    # The known downside: this consumes two moving `:main` images, so an
    # upstream saas-backend or vocdoni-node regression can redden every open PR
    # with nothing wrong in this repo. That is a deliberate trade — the digests
    # printed below tell you immediately whether upstream moved. If it ever
    # becomes a nuisance, gate PR runs behind a label rather than deleting the
    # job.
    #
    # Source builds of the Go images (pinned refs) add a lot of time, hence 60.
    timeout-minutes: ${{ (needs.resolve.outputs.vocdoni_node_ref != '' || needs.resolve.outputs.saas_backend_ref != '') && 60 || 25 }}
    # Every comment and dispatch run gets its own group, so a pinned run is never
    # cancelled by a push, the nightly run or another comment. Queue order between
    # groups is not guaranteed, so "newest wins" could not be relied on.
    concurrency:
      group: integration-${{ (github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read # pull ghcr.io/vocdoni/saas-backend
    outputs:
      vocdoni_node_sha: ${{ steps.pins.outputs.vocdoni_node_sha }}
      saas_backend_sha: ${{ steps.pins.outputs.saas_backend_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Empty except for /integration comment runs (the PR's merge commit)
          # and dispatches with integrator_sdk_ref; empty means the default event ref.
          ref: ${{ needs.resolve.outputs.checkout_ref }}
          persist-credentials: false

      # Trusted: on issue_comment github.sha is main, so the build script never comes
      # from a fork's PR merge commit. On pull_request it is the merge commit, but
      # fork runs get no secrets there.
      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .trusted
          persist-credentials: false

      # Keep this step and the image pull below ahead of any step that runs PR code
      # (pnpm install runs install scripts): they handle the deploy key and the ghcr.io token.
      - name: Build pinned images
        id: pins
        if: needs.resolve.outputs.vocdoni_node_ref != '' || needs.resolve.outputs.saas_backend_ref != ''
        env:
          SAAS_BACKEND_DEPLOY_KEY: ${{ secrets.SAAS_BACKEND_DEPLOY_KEY }}
          NODE_REF: ${{ needs.resolve.outputs.vocdoni_node_ref }}
          SAAS_REF: ${{ needs.resolve.outputs.saas_backend_ref }}
        run: |
          set -euo pipefail
          # build <repo> <ref> <ENV_VAR> <output_name>: runs in the background.
          # Output goes to files, so a failure shows at `wait`, not via errexit.
          build() {
            local repo="$1" ref="$2" env_var="$3" output="$4"
            local image sha
            .trusted/scripts/integration-build-image.sh "$repo" "$ref" > "$RUNNER_TEMP/$repo.out" 2> "$RUNNER_TEMP/$repo.log" || return 1
            image="$(sed -n 's/^image=//p' "$RUNNER_TEMP/$repo.out")"
            sha="$(sed -n 's/^sha=//p' "$RUNNER_TEMP/$repo.out")"
            [ -n "$image" ] && [ -n "$sha" ] || return 1
            echo "$env_var=$image" >> "$GITHUB_ENV"
            echo "$output=$sha" >> "$GITHUB_OUTPUT"
          }
          names=()
          pids=()
          if [ -n "$NODE_REF" ]; then
            build vocdoni-node "$NODE_REF" VOCDONI_NODE_IMAGE vocdoni_node_sha &
            names+=(vocdoni-node)
            pids+=("$!")
          fi
          if [ -n "$SAAS_REF" ]; then
            build saas-backend "$SAAS_REF" SAAS_BACKEND_IMAGE saas_backend_sha &
            names+=(saas-backend)
            pids+=("$!")
          fi
          failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "::error::build of ${names[$i]} failed" >&2
              failed=1
            fi
          done
          for repo in "${names[@]}"; do
            echo "::group::$repo build"
            cat "$RUNNER_TEMP/$repo.log"
            echo "::endgroup::"
          done
          [ "$failed" = 0 ]

      - name: Pull images and print digests
        # :main is tracked deliberately (see integration/README.md); a green
        # run can go red with no change in this repo. This makes a red run
        # reproducible locally. The ghcr.io login lasts only for this step.
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          if [ -n "${VOCDONI_NODE_IMAGE:-}" ]; then
            echo "vocdoni-node built from source: $VOCDONI_NODE_IMAGE"
          else
            docker pull ghcr.io/vocdoni/vocdoni-node:main
            docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/vocdoni/vocdoni-node:main
          fi
          if [ -n "${SAAS_BACKEND_IMAGE:-}" ]; then
            echo "saas-backend built from source: $SAAS_BACKEND_IMAGE"
          else
            docker pull ghcr.io/vocdoni/saas-backend:main
            docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/vocdoni/saas-backend:main
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Summarize tested refs
        env:
          NODE_REF: ${{ needs.resolve.outputs.vocdoni_node_ref }}
          NODE_SHA: ${{ steps.pins.outputs.vocdoni_node_sha }}
          SAAS_REF: ${{ needs.resolve.outputs.saas_backend_ref }}
          SAAS_SHA: ${{ steps.pins.outputs.saas_backend_sha }}
        run: |
          {
            echo "### Tested refs"
            echo "- integrator-sdk: \`$(git rev-parse --short HEAD)\`"
            if [ -n "$NODE_REF" ]; then
              echo "- vocdoni-node: \`$NODE_REF\` → \`$NODE_SHA\`"
            else
              echo "- vocdoni-node: :main image"
            fi
            if [ -n "$SAAS_REF" ]; then
              echo "- saas-backend: \`$SAAS_REF\` → \`$SAAS_SHA\`"
            else
              echo "- saas-backend: :main image"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start stack and bootstrap integrator key
        id: stack
        run: scripts/integration-stack.sh up

      - name: Run integration suite
        env:
          INTEGRATION_API_URL: ${{ steps.stack.outputs.api_url }}
          INTEGRATION_API_KEY: ${{ steps.stack.outputs.api_key }}
        run: pnpm test:integration

      - name: Dump container logs
        if: failure()
        run: |
          mkdir -p /tmp/integration-logs
          docker compose -f integration/docker-compose.ci.yml logs --no-color vocone > /tmp/integration-logs/vocone.log
          docker compose -f integration/docker-compose.ci.yml logs --no-color api > /tmp/integration-logs/api.log
          docker compose -f integration/docker-compose.ci.yml logs --no-color mongo > /tmp/integration-logs/mongo.log

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: /tmp/integration-logs

      - name: Tear down stack
        if: always()
        run: scripts/integration-stack.sh down

  report:
    name: Report to PR
    needs: [resolve, integration]
    # Only an authorized /integration comment gets a reply. Anyone else is
    # ignored silently.
    if: ${{ always() && github.event_name == 'issue_comment' && needs.resolve.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post result to the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          PARSED: ${{ needs.resolve.outputs.parsed }}
          RESOLVE: ${{ needs.resolve.result }}
          RESULT: ${{ needs.integration.result }}
          RESET: ${{ needs.resolve.outputs.reset }}
          STICKY: ${{ needs.resolve.outputs.sticky }}
          CHECKOUT: ${{ needs.resolve.outputs.checkout_ref }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          NODE_REF: ${{ needs.resolve.outputs.vocdoni_node_ref }}
          SAAS_REF: ${{ needs.resolve.outputs.saas_backend_ref }}
          NODE_SHA: ${{ needs.integration.outputs.vocdoni_node_sha }}
          SAAS_SHA: ${{ needs.integration.outputs.saas_backend_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/report.md"
          # Refs and SHAs are printed as full URLs: a bare #N or SHA would link to this repo.
          # One line per upstream: ':main image' when unpinned, 'ref → sha' when pinned.
          upstream() {
            local base="https://github.com/vocdoni/$1" ref="$2" sha="$3" ref_link sha_link
            if [[ "$ref" =~ ^#([0-9]+)$ ]]; then
              ref_link="$base/pull/${BASH_REMATCH[1]}"
            elif [[ "$ref" =~ ^[0-9A-Fa-f]{7,40}$ ]]; then
              ref_link="$base/commit/$ref"
            else
              ref_link="[\`$ref\`]($base/tree/$ref)"
            fi
            if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              sha_link="$base/commit/$sha"
            else
              sha_link='not built'
            fi
            if [ -n "$ref" ]; then
              echo "- $1: $ref_link → $sha_link"
            else
              echo "- $1: :main image"
            fi
          }
          {
            if [ "$PARSED" != true ]; then
              echo "Integration run: **rejected**: the \`/integration\` command could not be parsed, see the run log."
            elif [ "$RESOLVE" != success ]; then
              echo "Integration run: **error** resolving the PR ($RESOLVE), see the run log; comment again to retry."
            elif [ "$RESET" = true ]; then
              echo "Sticky integration refs cleared; pushes use the \`:main\` images again."
              echo
              echo "- Run: $RUN_URL"
            else
              echo "Integration run: **$RESULT**"
              echo
              if [[ "$CHECKOUT" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "- SDK: merge of $SERVER_URL/$REPO/commit/$HEAD_SHA ($SERVER_URL/$REPO/commit/$CHECKOUT)"
              else
                echo "- SDK: not resolved"
              fi
              upstream vocdoni-node "$NODE_REF" "$NODE_SHA"
              upstream saas-backend "$SAAS_REF" "$SAAS_SHA"
              echo "- Run: $RUN_URL"
              if [ "$STICKY" = true ]; then
                echo
                echo "These refs are re-resolved on every push to this PR until \`/integration reset\`."
              else
                echo
                echo "One-shot run: pushes keep using the previous sticky refs, if any."
              fi
            fi
          } > "$body"
          gh pr comment "$PR" -R "$REPO" --body-file "$body"

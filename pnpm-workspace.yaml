packages:
  - 'packages/*'

overrides:
  '@types/react': 19.x
  react: ^19.0.0
  react-dom: ^19.0.0
  'react-router@<7.18.2': ^7.18.2
  'react-router-dom@<7.18.2': ^7.18.2
  'underscore@<1.13.8': ^1.13.8
  'ws@>=8.0.0 <8.21.0': ^8.21.0
  '@vocdoni/proto': github:vocdoni/dvote-protobuf#04e7afe6fe2b24f1a20fd5f3fbef0b9fdad87e76

onlyBuiltDependencies:
  - msw

allowBuilds:
  blake-hash: false
  esbuild: true
  msw: true
  protobufjs: false

minimumReleaseAgeExclude:
  - '@vocdoni/proto@1.18.0'
